name: Build & Publish VoxCast APK

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Gradle & Android dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Configure Android SDK & accept licenses
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          SDKMANAGER="$(find "$SDK_ROOT" -name sdkmanager -type f 2>/dev/null | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            mkdir -p "$SDK_ROOT/cmdline-tools"
            curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/cmdline-tools.zip
            unzip -q /tmp/cmdline-tools.zip -d "$SDK_ROOT/cmdline-tools"
            mv "$SDK_ROOT/cmdline-tools/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --install "platform-tools" "build-tools;36.0.0" "platforms;android-36" "platforms;android-36.1" || \
            "$SDKMANAGER" --install "platform-tools" "build-tools;36.0.0" "platforms;android-36"

      - name: Install Gradle 9.3.1
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-9.3.1-bin.zip -o /tmp/gradle.zip
          sudo unzip -q -o /tmp/gradle.zip -d /opt
          echo "/opt/gradle-9.3.1/bin" >> "$GITHUB_PATH"
          /opt/gradle-9.3.1/bin/gradle --version

      - name: Prepare .env and signing keystores
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          fi

          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          else
            keytool -genkeypair -v -keystore debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US" -noprompt
          fi

          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > my-upload-key.jks
          else
            keytool -genkeypair -v -keystore my-upload-key.jks \
              -storepass "voxcast-ci-pass" -alias upload -keypass "voxcast-ci-pass" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=VoxCast,O=VoxCast,C=US" -noprompt
          fi

      - name: Run unit tests
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'voxcast-ci-pass' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'voxcast-ci-pass' }}
        run: gradle --no-daemon :app:testDebugUnitTest --tests "com.example.VoiceDspProcessorTest" --tests "com.example.ExampleUnitTest"

      - name: Build Debug and Release APKs
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'voxcast-ci-pass' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'voxcast-ci-pass' }}
        run: |
          gradle --no-daemon assembleDebug assembleRelease
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/VoxCast.apk
          cp app/build/outputs/apk/release/app-release.apk dist/VoxCast-release.apk

      - name: Upload APK build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VoxCast-APKs
          path: |
            dist/VoxCast.apk
            dist/VoxCast-release.apk
          retention-days: 30

      - name: Publish APK to GitHub Releases
        if: |
          github.event_name == 'push' &&
          (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/v'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && format('VoxCast {0}', github.ref_name) || 'VoxCast Latest Build' }}
          body: |
            Automated Android APK build from commit `${{ github.sha }}`.

            ### Direct Download
            - **VoxCast.apk** — Recommended for quick installation and updates on Android.
            - **VoxCast-release.apk** — Release build APK.
          make_latest: 'true'
          files: |
            dist/VoxCast.apk
            dist/VoxCast-release.apk
