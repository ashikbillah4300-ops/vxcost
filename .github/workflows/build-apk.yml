name: Build & Publish VoxCast APK

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare .env and signing keystores
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          fi

          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          else
            keytool -genkeypair -v -keystore debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > my-upload-key.jks
          else
            keytool -genkeypair -v -keystore my-upload-key.jks \
              -storepass "voxcast-ci-pass" -alias upload -keypass "voxcast-ci-pass" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=VoxCast,O=VoxCast,C=US"
          fi

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --tests "com.example.VoiceDspProcessorTest" --tests "com.example.ExampleUnitTest"

      - name: Build Debug and Release APKs
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'voxcast-ci-pass' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'voxcast-ci-pass' }}
        run: |
          gradle assembleDebug assembleRelease
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/VoxCast.apk
          cp app/build/outputs/apk/release/app-release.apk dist/VoxCast-release.apk

      - name: Upload APK build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VoxCast-APKs
          path: |
            dist/VoxCast.apk
            dist/VoxCast-release.apk
          retention-days: 30

      - name: Publish APK to GitHub Releases
        if: |
          github.event_name == 'push' &&
          (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/v'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && format('VoxCast {0}', github.ref_name) || 'VoxCast Latest Build' }}
          body: |
            Automated Android APK build from commit `${{ github.sha }}`.

            ### Direct Download
            - **VoxCast.apk** — Recommended for quick installation and seamless updates on Android.
            - **VoxCast-release.apk** — Release build APK.
          make_latest: true
          files: |
            dist/VoxCast.apk
            dist/VoxCast-release.apk
